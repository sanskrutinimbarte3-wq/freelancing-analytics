<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skill Explorer | Freelancing Analytics</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-md app-nav">
    <div class="container-xl">
      <a class="navbar-brand" href="/"><i class="bi bi-bar-chart-line-fill"></i> Freelance Analytics</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="/">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link active" href="/explore">Skill Explorer</a></li>
          <li class="nav-item"><a class="nav-link" href="/about">About</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container-xl py-4">
    <h1 class="page-title">Skill Explorer</h1>
    <p class="text-muted">Search and filter freelancer records, or compare two skills side by side.</p>

    <!-- Skill comparison -->
    <div class="card p-3 mb-4">
      <h2 class="card-title">Compare Two Skills</h2>
      <div class="row g-3 align-items-end">
        <div class="col-md-4"><label class="form-label" for="skill1">Skill 1</label>
          <select id="skill1" class="form-select">{% for s in skills %}<option>{{ s }}</option>{% endfor %}</select></div>
        <div class="col-md-4"><label class="form-label" for="skill2">Skill 2</label>
          <select id="skill2" class="form-select">{% for s in skills %}<option>{{ s }}</option>{% endfor %}</select></div>
        <div class="col-md-4"><button id="compareBtn" class="btn btn-accent w-100"><i class="bi bi-arrow-left-right"></i> Compare</button></div>
      </div>
      <div id="compareError" class="text-danger small mt-2"></div>
      <div id="compareResult" class="mt-3" style="display:none">
        <div class="table-responsive">
          <table class="table align-middle mb-2">
            <thead><tr><th>Metric</th><th class="text-end" id="thSkill1"></th><th class="text-end" id="thSkill2"></th></tr></thead>
            <tbody id="compareBody"></tbody>
          </table>
        </div>
        <div class="conclusion"><i class="bi bi-lightbulb"></i> <span id="compareConclusion"></span></div>
      </div>
    </div>

    <!-- Filters + table -->
    <div class="card p-3">
      <h2 class="card-title">Freelancer Records</h2>
      <div class="row g-3 mb-3">
        <div class="col-md-4"><input id="search" type="search" class="form-control" placeholder="Search skill, category, experience..."></div>
        <div class="col-6 col-md-2"><select id="fSkill" class="form-select"><option value="">All skills</option>{% for s in skills %}<option>{{ s }}</option>{% endfor %}</select></div>
        <div class="col-6 col-md-2"><select id="fCategory" class="form-select"><option value="">All categories</option>{% for c in categories %}<option>{{ c }}</option>{% endfor %}</select></div>
        <div class="col-6 col-md-2"><select id="fExperience" class="form-select"><option value="">All experience</option><option>Beginner</option><option>Intermediate</option><option>Expert</option></select></div>
        <div class="col-6 col-md-2"><select id="fDemand" class="form-select"><option value="">All demand</option><option>Low</option><option>Medium</option><option>High</option></select></div>
      </div>
      <div class="text-muted small mb-2" id="rowCount"></div>
      <div class="table-responsive table-scroll">
        <table class="table table-hover align-middle mb-0">
          <thead><tr><th>Skill</th><th>Category</th><th>Experience</th><th class="text-end">Hourly Rate</th><th class="text-end">Projects</th><th class="text-end">Rating</th><th class="text-end">Monthly Income</th><th>Demand</th></tr></thead>
          <tbody id="recordsBody"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
